[project]
name = "eskomsense-ai"
version = "1.0.0"
description = "AI-powered energy monitoring and prediction for South Africa"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "loguru==0.7.3",
    "pendulum==3.2.0",
    "aiofiles==25.1.0",
]

[tool.vercel]
entrypoint = "src.api.main:app"